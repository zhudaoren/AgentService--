# ============================================================
# AgentService平台 - Docker Compose 部署文件
# 版本: v3.0
# ============================================================

version: "3.8"

services:

  # ============================================================
  # 基础设施服务
  # ============================================================

  mysql:
    image: mysql:8.0
    container_name: agent-service-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_service}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    networks:
      - agent-service-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agent-service-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    networks:
      - agent-service-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: agent-service-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    networks:
      - agent-service-network
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-09-30T07-02-29Z
    container_name: agent-service-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - agent-service-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Milvus 暂时注释，等需要RAG时再启用
  # milvus:
  #   image: milvusdb/milvus:v2.4.0
  #   container_name: agent-service-milvus
  #   environment:
  #     ETCD_ENDPOINTS: etcd:2379
  #   command: ["milvus", "run", "standalone"]
  #   ports:
  #     - "${MILVUS_PORT:-19530}:19530"
  #     - "9091:9091"
  #   volumes:
  #     - milvus_data:/var/lib/milvus
  #   depends_on:
  #     - etcd
  #   networks:
  #     - agent-service-network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: agent-service-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - agent-service-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # 微服务 (Phase 0: 仅启动agent-svc和chat-svc做验证)
  # ============================================================

  agent-svc:
    build:
      context: ./services
      dockerfile: agent-svc/Dockerfile
    container_name: agent-service-agent
    environment:
      - APP_ENV=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-agent_service}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - LOG_LEVEL=info
    ports:
      - "8001:8001"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-service-network
    restart: unless-stopped

  chat-svc:
    build:
      context: ./services
      dockerfile: chat-svc/Dockerfile
    container_name: agent-service-chat
    environment:
      - APP_ENV=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-agent_service}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - LOG_LEVEL=info
    ports:
      - "8002:8002"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-service-network
    restart: unless-stopped

  tool-svc:
    build:
      context: ./services
      dockerfile: tool-svc/Dockerfile
    container_name: agent-service-tool
    environment:
      - APP_ENV=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-agent_service}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - LOG_LEVEL=info
    ports:
      - "8003:8003"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - agent-service-network
    restart: unless-stopped

  mem-svc:
    build:
      context: ./services
      dockerfile: mem-svc/Dockerfile
    container_name: agent-service-mem
    environment:
      - APP_ENV=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-agent_service}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - LOG_LEVEL=info
    ports:
      - "8004:8004"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agent-service-network
    restart: unless-stopped

  rag-svc:
    build:
      context: ./services
      dockerfile: rag-svc/Dockerfile
    container_name: agent-service-rag
    environment:
      - APP_ENV=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-agent_service}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - LOG_LEVEL=info
    ports:
      - "8005:8005"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - agent-service-network
    restart: unless-stopped

  chatbi-svc:
    build:
      context: ./services
      dockerfile: chatbi-svc/Dockerfile
    container_name: agent-service-chatbi
    environment:
      - APP_ENV=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-agent_service}
      - LOG_LEVEL=info
    ports:
      - "8006:8006"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - agent-service-network
    restart: unless-stopped

  coord-svc:
    build:
      context: ./services
      dockerfile: coord-svc/Dockerfile
    container_name: agent-service-coord
    environment:
      - APP_ENV=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-agent_service}
      - LOG_LEVEL=info
    ports:
      - "8007:8007"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - agent-service-network
    restart: unless-stopped

  evo-svc:
    build:
      context: ./services
      dockerfile: evo-svc/Dockerfile
    container_name: agent-service-evo
    environment:
      - APP_ENV=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-agent_service}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - LOG_LEVEL=info
    ports:
      - "8008:8008"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - agent-service-network
    restart: unless-stopped

  # ============================================================
  # 前端 (Phase 0: 暂时用 nginx 占位)
  # ============================================================

  frontend:
    image: nginx:alpine
    container_name: agent-service-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - agent-svc
    networks:
      - agent-service-network
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  rabbitmq_data:

networks:
  agent-service-network:
    driver: bridge
