# ============================================================
# AgentService平台 - Docker Compose 部署文件
# 版本: v3.0 (Phase 2)
# ============================================================

services:

  # ============================================================
  # 基础设施服务
  # ============================================================

  mysql:
    image: mysql:8.0
    container_name: agent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-agent_service}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agent-redis
    ports:
      - "6379:6379"
    command: >
      sh -c 'if [ -n "$REDIS_PASSWORD" ]; then
               exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD";
             else
               exec redis-server --appendonly yes;
             fi'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    networks:
      - agent-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping 2>/dev/null || redis-cli -a \"$REDIS_PASSWORD\" ping 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: agent-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: agent-milvus-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - milvus-etcd-data:/etcd
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus-minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: agent-milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - milvus-minio-data:/minio_data
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus-standalone:
    image: milvusdb/milvus:v2.4.0
    container_name: agent-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: agent-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # 微服务
  # ============================================================

  gateway:
    build:
      context: ./services
      dockerfile: gateway/Dockerfile
    container_name: agent-gateway
    environment:
      - APP_ENV=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-agent_service}
      - LOG_LEVEL=info
    ports:
      - "8000:8000"
    depends_on:
      - mysql
      - redis
    networks:
      - agent-net
    restart: unless-stopped

  agent-svc:
    build:
      context: ./services
      dockerfile: agent-svc/Dockerfile
    container_name: agent-svc
    environment:
      - APP_ENV=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-agent_service}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - LOG_LEVEL=info
    ports:
      - "8001:8001"
    depends_on:
      - mysql
      - redis
    networks:
      - agent-net
    restart: unless-stopped

  chat-svc:
    build:
      context: ./services
      dockerfile: chat-svc/Dockerfile
    container_name: agent-chat-svc
    environment:
      - APP_ENV=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-agent_service}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - LOG_LEVEL=info
    ports:
      - "8002:8002"
    depends_on:
      - mysql
      - redis
    networks:
      - agent-net
    restart: unless-stopped

  tool-svc:
    build: ./services/tool-svc
    container_name: agent-tool-svc
    ports:
      - "8003:8003"
    env_file: .env
    depends_on:
      - mysql
      - redis
      - minio
    volumes:
      - "./data/skills_uploads:/app/data/skills_uploads"
      - "./services/shared:/app/shared"
    networks:
      - agent-net
    restart: unless-stopped

  mem-svc:
    build:
      context: ./services
      dockerfile: mem-svc/Dockerfile
    container_name: agent-mem-svc
    environment:
      - APP_ENV=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-agent_service}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - MILVUS_HOST=milvus-standalone
      - MILVUS_PORT=19530
      - LOG_LEVEL=info
    ports:
      - "8004:8004"
    depends_on:
      - mysql
      - redis
    networks:
      - agent-net
    restart: unless-stopped

  rag-svc:
    build:
      context: ./services
      dockerfile: rag-svc/Dockerfile
    container_name: agent-rag-svc
    environment:
      - APP_ENV=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-agent_service}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - LOG_LEVEL=info
    ports:
      - "8005:8005"
    depends_on:
      - mysql
      - minio
    networks:
      - agent-net
    restart: unless-stopped

  chatbi-svc:
    build:
      context: ./services
      dockerfile: chatbi-svc/Dockerfile
    container_name: agent-chatbi-svc
    environment:
      - APP_ENV=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-agent_service}
      - LOG_LEVEL=info
    ports:
      - "8006:8006"
    depends_on:
      - mysql
    networks:
      - agent-net
    restart: unless-stopped

  coord-svc:
    build:
      context: ./services
      dockerfile: coord-svc/Dockerfile
    container_name: agent-coord-svc
    environment:
      - APP_ENV=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-agent_service}
      - LOG_LEVEL=info
    ports:
      - "8007:8007"
    depends_on:
      - mysql
    networks:
      - agent-net
    restart: unless-stopped

  evo-svc:
    build:
      context: ./services
      dockerfile: evo-svc/Dockerfile
    container_name: agent-evo-svc
    environment:
      - APP_ENV=docker
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_ROOT_PASSWORD:-root123}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-agent_service}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-guest}
      - LOG_LEVEL=info
    ports:
      - "8008:8008"
    depends_on:
      - mysql
      - rabbitmq
    networks:
      - agent-net
    restart: unless-stopped

  # ============================================================
  # 前端
  # ============================================================

  frontend:
    image: nginx:alpine
    container_name: agent-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - agent-svc
    networks:
      - agent-net
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  minio-data:
  milvus-etcd-data:
  milvus-minio-data:
  milvus-data:
  rabbitmq-data:

networks:
  agent-net:
    driver: bridge
